[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Prismo Glassnet runs cdk-erigon (Polygon CDK) and accepts legacy transactions only.
# scripts/deploy.sh passes --legacy and --with-gas-price on every network for that reason.
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
local = "${LOCAL_RPC_URL}"
prismo = "${PRISMO_RPC_URL}"

# Blockscout verifier for Prismo Glassnet. No API key is required.
[etherscan]
prismo = { key = "blockscout", chain = 101001000, url = "https://explorer.glassnet.prismo.network/api" }

[fmt]
line_length = 100
tab_width = 4
